# task name for logging
task_name: rna_refinement_v2_masked_residual

# unique seed for experiment reproducibility
seed: 42

# data config
datamodule: BaseDataModule
datamodule_args:
    # dataloader
    data_dir: "/storage9920/home/tinghao.xia/Data_Refinement_PT"
    dataloader_args:
        batch_size: 2
        num_workers: 2
        pin_memory: true
        persistent_workers: true
        drop_last: false

# model config
model: BaseFlow
model_args:
    # network args
    network_type: TorchMDDynamics
    hidden_channels: 128
    num_layers: 6
    num_rbf: 64
    rbf_type: expnorm
    trainable_rbf: true
    activation: silu
    neighbor_embedding: true
    cutoff_lower: 0.0
    cutoff_upper: 6.0
    dynamic_radius_cutoff: 6.0
    max_num_neighbors: 64
    max_z: 20
    node_attr_dim: 674
    edge_attr_dim: 7
    num_edge_types: 7
    confidence_conditioning: true
    attn_activation: silu
    num_heads: 8
    distance_influence: both
    reduce_op: sum
    qk_norm: true
    so3_equivariant: true
    clip_during_norm: true

    # flow matching specific
    sigma: 0.1
    # A single residual prediction is the intended refinement objective.
    # It is much cheaper and more stable than integrating a 50-step ODE.
    training_objective: residual
    flow_path: deterministic
    use_mobility_v1: true
    identity_pair_probability: 0.1
    near_native_pair_probability: 0.2
    near_native_min_alpha: 0.05
    near_native_max_alpha: 0.25
    mobility_gate_loss_weight: 0.1
    no_regret_loss_weight: 0.5
    protect_loss_weight: 0.2
    velocity_budget_loss_weight: 0.01


    # optimizer args
    optimizer_type: AdamW
    lr: 3.e-4
    weight_decay: 1.e-8

    # lr scheduler args
    lr_scheduler_type: CosineAnnealingWarmupRestarts
    first_cycle_steps: 32_000
    cycle_mult: 1.0
    max_lr: 3.e-4
    min_lr: 3.e-5
    warmup_steps: 1000
    gamma: 1.0
    last_epoch: -1
    lr_scheduler_monitor: val/loss
    lr_scheduler_interval: step
    lr_scheduler_frequency: 1

# callbacks
callbacks:
    -   callback: ModelCheckpoint
        callback_args:
            dirpath: './checkpoints/rna_refinement_v2_masked_residual'
            monitor: val/loss
            mode: min
            save_last: true
            every_n_epochs: 1
            save_top_k: 3

    -   callback: LearningRateMonitor
        callback_args:
            log_momentum: false
            logging_interval: step

    -   callback: EarlyStopping
        callback_args:
            monitor: val/loss
            mode: min
            patience: 3
            min_delta: 1.e-4

# logger
logger: WandbLogger
logger_args:
    project: RNA-Flow-Refinement



trainer: Trainer
trainer_args:
    max_epochs: 10
    devices: 8
    accelerator: gpu
    strategy: ddp_find_unused_parameters_true
    accumulate_grad_batches: 3
    precision: bf16-mixed
    num_sanity_val_steps: 0
    gradient_clip_val: 1.0

# eval config
eval_args:
    batch_size: 1
    sampler_args:
        sampler_type: ode
        n_timesteps: 1
        s_churn: 1.0
        t_min: 0.0001
        t_max: 0.9999
        std: 1.0
