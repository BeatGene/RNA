# task name for logging
task_name: RNA_test_02_rmsd_less

# unique seed for experiment reproducibility
seed: 42

# data config
datamodule: BaseDataModule
datamodule_args:
    # dataloader
    data_dir: "/storage9920/home/tinghao.xia/Data_V1"
    dataloader_args:
        batch_size: 1
        num_workers: 2
        pin_memory: true
        persistent_workers: true
        drop_last: false

# model config
model: BaseFlow
model_args:
    # network args
    network_type: TorchMDDynamics
    hidden_channels: 128
    num_layers: 6
    num_rbf: 64
    rbf_type: expnorm
    trainable_rbf: true
    activation: silu
    neighbor_embedding: true
    cutoff_lower: 0.0
    cutoff_upper: 4.5
    max_z: 20
    node_attr_dim: 674
    edge_attr_dim: 7
    num_edge_types: 7
    confidence_conditioning: true
    attn_activation: silu
    num_heads: 8
    distance_influence: both
    reduce_op: sum
    qk_norm: true
    so3_equivariant: true
    clip_during_norm: true

    # flow matching specific
    sigma: 0.1


    # optimizer args
    optimizer_type: AdamW
    lr: 3.e-4
    weight_decay: 1.e-8

    # lr scheduler args
    lr_scheduler_type: CosineAnnealingWarmupRestarts
    first_cycle_steps: 100_000
    cycle_mult: 1.0
    max_lr: 3.e-4
    min_lr: 3.e-5
    warmup_steps: 1000
    gamma: 1.0
    last_epoch: -1
    lr_scheduler_monitor: val/loss
    lr_scheduler_interval: step
    lr_scheduler_frequency: 1

# callbacks
callbacks:
    -   callback: ModelCheckpoint
        callback_args:
            dirpath: './checkpoints/rna_refinement_v1'
            monitor: val/loss
            mode: min
            save_last: true
            every_n_epochs: 1
            save_top_k: 3

    -   callback: LearningRateMonitor
        callback_args:
            log_momentum: false
            logging_interval: step

# logger
logger: WandbLogger
logger_args:
    project: RNA-Flow-Refinement



trainer: Trainer
trainer_args:
    max_epochs: 200
    devices: 7
    accelerator: gpu
    strategy: ddp_find_unused_parameters_true
    accumulate_grad_batches: 6
    precision: bf16-mixed
    num_sanity_val_steps: 0

# eval config
eval_args:
    batch_size: 32
    sampler_args:
        sampler_type: ode
        n_timesteps: 50
        s_churn: 1.0
        t_min: 0.0001
        t_max: 0.9999
        std: 1.0
